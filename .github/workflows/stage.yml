name: Staging

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Run tests on pushes to staging and pull requests to staging and master
on:
  push:
    branches: [ staging ]
  pull_request:
    branches: [ staging, master ]

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/test.yml
