name: CI

on:
  workflow_call:

jobs:
  linter:
    name: linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run ESLint
        run: ./tools/run-eslint.sh

  shexli:
    name: shexli
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile GSettings Schema
        run: glib-compile-schemas schemas/

      - name: Package Extension
        id: pack
        uses: murar8/gnome-extensions-action@0.1.1
        with:
          source-dir: .
          extra-source: |
            lib/
            queries.json
          schema: schemas/org.gnome.shell.extensions.observability.gschema.xml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Package with shexli
        run: ./tools/run-shexli.sh "${{ steps.pack.outputs.zip-file }}"
